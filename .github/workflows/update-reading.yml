name: Update currently-reading

on:
    schedule:
        - cron: '0 8 * * 1'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-reading:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: node scripts/update-reading.mjs

            - name: Commit if changed
              run: |
                  if git diff --quiet -- src/content.ts; then
                    echo "No changes."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add src/content.ts
                  git commit -m "chore: update currently-reading from Goodreads"
                  git push
